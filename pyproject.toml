[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodalcode"
version = "0.1.0"
description = "Self-verification evaluation for multimodal coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MultimodalCode contributors" }]
dependencies = []

[project.optional-dependencies]
render = [
  "Pillow>=9.0",
  "playwright==1.60.0",
]
transformers = [
  "accelerate>=0.25",
  "Pillow>=9.0",
  "torch>=2.1",
  "transformers>=4.45",
]
flame = [
  "Pillow>=9.0",
]
design2code = [
  "beautifulsoup4>=4.12",
  "colormath>=3.0",
  "matplotlib>=3.7",
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.8",
  "openai-clip>=1.0.1",
  "packaging>=23",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.66",
]
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".local/cache/pytest"
